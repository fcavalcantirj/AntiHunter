[platformio]
src_dir = .

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_unflags = -std=gnu++14
build_flags =
 -std=gnu++17
 -D CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY=1
 -D BOARD_HAS_PSRAM

[env:AntiHunter-full]
extends = env
board = seeed_xiao_esp32s3
build_src_filter = -<*>+<Antihunter/full/src/*>
monitor_speed = 115200
extra_scripts = post:scripts/set_rtc_time.py
lib_deps =
 esp32async/ESPAsyncWebServer@3.10.0
 esp32async/AsyncTCP@3.4.10
 mikalhart/TinyGPSPlus@1.1.0
 h2zero/NimBLE-Arduino@2.3.9
 adafruit/RTClib@2.1.4
 bblanchon/ArduinoJson@6.21.6
build_flags =
 ${env.build_flags}
 -D ARDUINO_USB_CDC_ON_BOOT=1
 -D ARDUINO_USB_MODE=1
 -D CONFIG_BT_NIMBLE_ENABLED=1
 -D CONFIG_ESP32_WIFI_RAW_FRAME_SANITY_CHECK=0
 -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
 -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
 -D AH_CS_BLE=0
 -D AH_SENTINEL=0
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<Antihunter/full/src/*> -<Antihunter/full/src/wifi.c> -<Antihunter/full/src/opendroneid.c>
check_flags =
            --enable=all
            --std=c++17
            --suppress=missingIncludeSystem
            --suppress=missingInclude
            --suppress=checkersReport
            --suppress=normalCheckLevelMaxBranches
            --suppress=checkLevelNormal
            --suppress=unmatchedSuppression
            --suppress=useStlAlgorithm
            --inline-suppr
            -DPROGMEM=

[env:AntiHunter-headless]
extends = env
board = seeed_xiao_esp32s3
build_src_filter = -<*>+<Antihunter/headless/src/*>
monitor_speed = 115200
extra_scripts = post:scripts/set_rtc_time.py
lib_deps =
 mikalhart/TinyGPSPlus@1.1.0
 h2zero/NimBLE-Arduino@2.3.9
 adafruit/RTClib@2.1.4
 bblanchon/ArduinoJson@6.21.6
build_flags =
 ${env.build_flags}
 -D ARDUINO_USB_CDC_ON_BOOT=1
 -D ARDUINO_USB_MODE=1
 -D CONFIG_BT_NIMBLE_ENABLED=1
 -D CONFIG_ESP32_WIFI_RAW_FRAME_SANITY_CHECK=0
 -D AH_CS_BLE=0
 -D AH_SENTINEL=0
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<Antihunter/headless/src/*> -<Antihunter/headless/src/wifi.c> -<Antihunter/headless/src/opendroneid.c>
check_flags =
            --enable=all
            --std=c++17
            --suppress=missingIncludeSystem
            --suppress=missingInclude
            --suppress=checkersReport
            --suppress=normalCheckLevelMaxBranches
            --suppress=checkLevelNormal
            --suppress=unmatchedSuppression
            --suppress=useStlAlgorithm
            --inline-suppr
            -DPROGMEM=

; Generic ESP32-S3-WROOM-1 N16R8: 16 MB QIO flash + 8 MB octal PSRAM.
; This target deliberately leaves the legacy external SD/GPS/RTC/vibration and
; Meshtastic UART pins untouched. The full web UI is the control surface.
[env:AntiHunter-n16r8-full]
extends = env:AntiHunter-full
board = esp32-s3-devkitc1-n16r8
build_flags =
 ${env:AntiHunter-full.build_flags}
 -D AH_EXTERNAL_PERIPHERALS=0
 -D AH_MESH_UART=0

; Espressif QEMU currently requires DIO flash. This is a boot-test image only,
; not an upload target for the physical N16R8 board.
[env:AntiHunter-n16r8-qemu]
extends = env:AntiHunter-n16r8-full
board_build.flash_mode = dio
board_upload.flash_mode = dio
board_build.arduino.memory_type = dio_opi
build_unflags =
 ${env.build_unflags}
 -D ARDUINO_USB_CDC_ON_BOOT=1
build_flags =
 ${env:AntiHunter-n16r8-full.build_flags}
 -D ARDUINO_USB_CDC_ON_BOOT=0
 -D AH_RADIO=0
